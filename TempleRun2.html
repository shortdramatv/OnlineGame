<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elky API - Game</title>
    <style>
        body, html {
            touch-action: none;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
            overflow: hidden;
        }
        .game-wrapper {
            user-select: none;
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .game-container {
            user-select: none;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .game-preloader {
            user-select: none;
            width: 100%;
            height: 100%;
            background: #262626;
            position: absolute;
            inset: 0;
            z-index: 10010;
        }
        .game-preloader > img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .game-preloader-filter {
            position: absolute;
            inset: 0;
            backdrop-filter: blur(20px);
        }
        .game-preloader-content {
            position: absolute;
            inset: 0;
        }
        .game-preloader-content-center {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            height: 100%;
            flex-direction: column;
        }
        .game-preloader-content-center > img {
            border-radius: 10px;
            width: 200px;
            margin-bottom: 24px;
            box-shadow: 0 1px 1px hsl(0deg 0% 0% / .075), 0 2px 2px hsl(0deg 0% 0% / .075), 0 4px 4px hsl(0deg 0% 0% / .075), 0 8px 8px hsl(0deg 0% 0% / .075), 0 16px 16px hsl(0deg 0% 0% / .075);
        }
        /* वर्टिकल मोड के लिए अतिरिक्त स्टाइल */
        @media (orientation: portrait) {
            .game-container {
                width: 100%;
                height: 100%;
            }
        }
        @media (orientation: landscape) {
            .game-container {
                width: 100%;
                height: 100%;
            }
        }
    </style>
    <script src="https://g.elky.net/libs/elky-api/1.0.1/elky-api.min.js"></script>
</head>
<body>
    <script>
        function addPreload(href, as, type, crossorigin = false) {
            if(!href) return;
            const link = document.createElement("link");
            link.rel = "preload";
            link.href = href;
            link.as = as;
            if (type) link.type = type;
            if (crossorigin) link.crossOrigin = "anonymous";
            document.head.appendChild(link);
        }
        const urlParams = new URLSearchParams(window.location.search);
        addPreload(urlParams.get('preload-wasm') || '/ruffle/ruffle_web_bg.wasm', "fetch", "application/wasm", true);
        addPreload(urlParams.get('preload-game'), "fetch", "", true);

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
    </script>

    <div class="game-wrapper" id="gameWrapper">
        <div class="game-container" id="gameContainer">
            <iframe width="100%" height="100%" id="gameContainerFrame" src="https://temple-run-2.gcdn.dev/index.html?elky-locale=en-US" frameborder="0" scrolling="no" allow="autoplay; camera; focus-without-user-activation *; monetization; gamepad; keyboard-map *; xr-spatial-tracking; clipboard-write; web-share; accelerometer; magnetometer; gyroscope; display-capture"></iframe>
        </div>
    </div>
    <div class="game-preloader" id="gamePreloader" style="display: none;">
        <img class="game-image" src="https://i.elky.com/autogen/games/1/1obxsydmhca1m486/image0-664x664.avif" alt="Game Preloader">
        <div class="game-preloader-filter"></div>
        <div class="game-preloader-content">
            <div class="game-preloader-content-center">
                <img class="game-image" src="https://i.elky.com/autogen/games/1/1obxsydmhca1m486/image0-664x664.avif" alt="Game Preloader">
                <svg width="72" height="16" viewBox="0 0 72 16" role="img" aria-label="Loading">
                    <circle cx="8" cy="8" r="8" fill="currentColor">
                        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"></animate>
                    </circle>
                    <circle cx="36" cy="8" r="8" fill="currentColor">
                        <animate attributeName="opacity" values="1;0.2;1" dur="1s" begin=".15s" repeatCount="indefinite"></animate>
                    </circle>
                    <circle cx="64" cy="8" r="8" fill="currentColor">
                        <animate attributeName="opacity" values="1;0.2;1" dur="1s" begin=".3s" repeatCount="indefinite"></animate>
                    </circle>
                </svg>
            </div>
        </div>
    </div>

    <script>
        let eparams = {}

        function resizeContainer() {
            const containerFrame = document.getElementById("gameContainer");
            const containerWrapper = document.getElementById("gameWrapper");

            if (!containerWrapper || !containerFrame) {
                return;
            }

            let scaleX = containerWrapper.clientWidth / eparams.width;
            let scaleY = containerWrapper.clientHeight / eparams.height;
            const minScale = Math.min(scaleX, scaleY);

            if(eparams.scale === 'none') {
                containerFrame.style.transform = `translate(-50%, -50%) scale(${minScale})`;
                containerFrame.style.width = `${100 / scaleX}%`;
                containerFrame.style.height = `${100 / scaleY}%`;
            } else if(eparams.scale === 'uniform') {
                scaleX /= minScale;
                scaleY /= minScale;
                containerFrame.style.width = `${100 / scaleX}%`;
                containerFrame.style.height = `${100 / scaleY}%`;
            }
        }

        function parseJSONsafely(json) { 
            try { return JSON.parse(json); } 
            catch (e) { return null; } 
        }

        async function loadConfig(configStr, root) {
            let cfg = null;
            try {
                if (typeof configStr === 'string' && configStr.trim()) {
                    cfg = JSON.parse(configStr);
                    if(cfg?.file) {
                        const path = (cfg.file[0] === '/' ? root : '') + cfg.file;
                        const response = await fetch(path);
                        cfg = await response.json();
                    }
                }
            } catch (error) {
                console.log('Config Error:', error);
                cfg = null;
            }
            return cfg;
        }

        async function initAndLoadGame() {
            const urlParams = new URLSearchParams(window.location.search);
            const rootPath = urlParams.get('root');
            const gamePath = urlParams.get('path');
            const scale = urlParams.get('scale');
            const init_width = urlParams.get('width');
            const init_height = urlParams.get('height');
            const embed = urlParams.get('embed');
            const locale = urlParams.get('locale');
            const config = await loadConfig(urlParams.get('config'), rootPath);

            const img = urlParams.get('image');
            img && document.querySelectorAll('.game-image').forEach(el => { 
                el.src = img; 
                el.hidden = false; 
            });

            if(embed === 'file') {
                const ruffleSrc = config?.ruffle?.version || 'ruffle-elky-2025-12-12';
                await loadScript(`https://g.elky.net/libs/ruffle-rs/${ruffleSrc}/ruffle.js`, false);
            }
            await loadScript('https://g.elky.net/libs/elky-api/1.0.1/elky-api.min.js', false);

            // 🔥 यहाँ मुख्य बदलाव - वर्टिकल मोड के लिए width और height बदली गई है
            eparams = {
                root: rootPath || '',
                path: gamePath || '',
                scale: scale || 'none',
                width: init_width || '360',     // ← वर्टिकल के लिए चौड़ाई (पहले 920 था)
                height: init_height || '640',   // ← वर्टिकल के लिए ऊँचाई (पहले 320 था)
                embed: embed || 'file',
                config: config || {}
            }
            
            const containerWrapper = document.getElementById("gameWrapper");
            if (containerWrapper) {
                const resizeObserver = new ResizeObserver(resizeContainer);
                resizeObserver.observe(containerWrapper);
                resizeContainer();
            }
            
            try {
                console.log('Initializing Elky API...');

                if(eparams.embed === 'file') {
                    eparams.config.ruffle = eparams.config?.ruffle || {};
                }
                eparams.config.root = eparams.root;
                
                await eapi.init(eparams.config);

                if(eparams.embed === 'file') {
                    const rufflePlayer = eapi.getRufflePlayer();
                    if(rufflePlayer) {
                        const container = document.getElementById('gameContainer');
                        container.appendChild(rufflePlayer);
                        rufflePlayer.style.width = '100%';
                        rufflePlayer.style.height = '100%';

                        rufflePlayer.addEventListener("loadedmetadata", () => {
                            console.log("Ruffle finished loading the SWF/game!");
                        });
                    
                        console.log('API initialized, loading game...');
                        const gamePath = eparams.path;
                        await eapi.getRufflePlayer().ruffle().load({ url: gamePath });
                        console.log('Game loaded successfully');
                    } else {
                        console.error('Ruffle player not found');
                    }
                } else if(eparams.embed === 'iframe') {
                    var url = new URL(eparams.path);
                    url.searchParams.set('elky-locale', locale);
                    const iframe = document.createElement('iframe');
                    iframe.width = '100%';
                    iframe.height = '100%';
                    iframe.id = 'gameContainerFrame';
                    iframe.src = url.toString();
                    iframe.frameBorder = '0';
                    iframe.scrolling = 'no';
                    iframe.allowFullscreen = false;
                    iframe.allow="autoplay; camera; focus-without-user-activation *; monetization; gamepad; keyboard-map *; xr-spatial-tracking; clipboard-write; web-share; accelerometer; magnetometer; gyroscope; display-capture";

                    document.getElementById('gameContainer').appendChild(iframe);
                } else {
                    console.error("Unsupported embed type:", eparams.embed);
                }
                document.getElementById('gamePreloader').style.display = 'none';
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        window.addEventListener('load', initAndLoadGame);
    </script>
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon="{&quot;version&quot;&quot;:&quot;2024.11.0&quot;,&quot;token&quot;:&quot;0ac733e675244fc3bf80b0ace42197a1&quot;,&quot;r&quot;:1}" crossorigin="anonymous"></script>
</body>
</html>
